name: Build DonutTools

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Extract project
        run: |
          mkdir project
          ZIP=$(find . -maxdepth 1 -type f -name '*-loader-*.zip' -print -quit)
          if [ -z "$ZIP" ]; then
            echo "Loader ZIP not found"
            exit 1
          fi
          unzip -q "$ZIP" -d project

      - name: Find Gradle project
        run: |
          GRADLEW=$(find project -name gradlew -type f -print -quit)

          if [ -z "$GRADLEW" ]; then
            echo "gradlew was not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$GRADLEW")
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build mod
        run: |
          chmod +x "$PROJECT_DIR/gradlew"
          cd "$PROJECT_DIR"
          ./gradlew build --no-daemon

      - name: Collect JAR
        run: |
          mkdir artifacts
          find "$PROJECT_DIR/build/libs" \
            -type f \
            -name "*.jar" \
            -exec cp {} artifacts/ \;

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: DonutTools-JAR
          path: artifacts/*.jar
